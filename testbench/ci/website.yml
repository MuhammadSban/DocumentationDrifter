# runs our HTTP and browser tests locally on PRs, with an optional hosted target on manual runs

name: Website tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      website_url:
        description: "API URL; empty starts the API locally"
        required: false
        default: "https://documentationdrifter-production.up.railway.app"
      console_url:
        description: "Console page URL; empty starts the existing console locally"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFTER_TARGET_URL: ${{ inputs.website_url || '' }}
      DRIFTER_CONSOLE_URL: ${{ inputs.console_url || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            testbench/requirements.txt
      - name: Install website test dependencies
        run: |
          python -m pip install -r testbench/requirements.txt
          python -m playwright install --with-deps chromium --only-shell
      - name: Run the tailored suite
        run: python -m pytest testbench/tests -q -ra --maxfail=1 --junitxml=testbench/results/website.xml --screenshot=only-on-failure --tracing=retain-on-failure --output=testbench/results/browser
      - name: Upload test results and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-test-results
          path: testbench/results/
          if-no-files-found: warn
